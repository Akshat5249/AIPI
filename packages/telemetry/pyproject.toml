[project]
name = "aipi-telemetry"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.10,<3", "sqlalchemy>=2.0,<3", "alembic>=1.15", "psycopg[binary]>=3.2", "httpx>=0.28", "opentelemetry-sdk>=1.30,<1.40", "opentelemetry-exporter-otlp-proto-http>=1.30,<1.40", "opentelemetry-instrumentation-fastapi>=0.51b0,<0.61", "opentelemetry-instrumentation-httpx>=0.51b0,<0.61"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/aipi_telemetry"]
