name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    env:
      MODEL_PROVIDER: mock
      UV_CACHE_DIR: /tmp/aipi-uv-cache
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: astral-sh/setup-uv@v6
        with: {version: '0.11.21', enable-cache: true, python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '25', cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - name: Full-history secret scan
        run: >-
          docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.24.2
          git /repo --redact --no-banner --log-opts=--all
      - run: make setup
      - run: make lint
      - run: uv run pytest -m 'not docker'
      - name: Golden metrics and critical hallucination gate
        run: make eval
      - run: cd apps/web && npm test && npm run build
      - name: Build images and health smoke
        run: make up
      - run: make seed-traffic
      - name: Live telemetry, chaos, agents and database isolation gate
        run: make test
      - name: Logs on failure
        if: failure()
        run: docker compose --env-file .env -f infra/docker/compose.yml logs --tail=80
      - name: Cleanup
        if: always()
        run: make down
      # Golden metrics, schema/citation and adversarial CLI gates run above.
      - name: Publication disabled for the local lab
        run: echo "All gates required; publishing/deployment is intentionally disabled."
