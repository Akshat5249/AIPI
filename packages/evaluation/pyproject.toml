[project]
name = "aipi-evaluation"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2", "aipi-agents", "aipi-tools", "aipi-telemetry", "fastapi>=0.115,<1", "httpx>=0.28", "sqlalchemy>=2", "psycopg[binary]>=3", "python-dotenv>=1", "pydantic-settings>=2"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/aipi_evaluation"]
